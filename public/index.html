<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Watermark Remover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  .container { max-width: 720px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 8px; color: #f0f6fc; }
  p.sub { color: #8b949e; margin-bottom: 16px; }
  .mode-bar { display: flex; gap: 8px; margin-bottom: 24px; }
  .mode-btn { padding: 6px 16px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #8b949e; cursor: pointer; font-size: 13px; transition: all .2s; }
  .mode-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .mode-btn:hover:not(.active) { border-color: #58a6ff; color: #c9d1d9; }
  .dropzone { border: 2px dashed #30363d; border-radius: 12px; padding: 60px 20px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; margin-bottom: 24px; }
  .dropzone:hover, .dropzone.drag { border-color: #58a6ff; background: #161b22; }
  .dropzone p { color: #8b949e; }
  .dropzone .icon { font-size: 48px; margin-bottom: 12px; }
  .file-list { margin-bottom: 16px; }
  .file-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
  .file-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .size { color: #8b949e; font-size: 12px; }
  .file-row .remove-btn { color: #f85149; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  .file-row .remove-btn:hover { color: #ff6b6b; }
  .progress { margin-bottom: 16px; }
  .progress-bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; background: #238636; border-radius: 3px; transition: width .3s; width: 0%; }
  .progress-text { font-size: 12px; color: #8b949e; text-align: center; }
  .preview { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .preview-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; max-width: 320px; }
  .preview-card h3 { font-size: 14px; color: #8b949e; margin-bottom: 8px; }
  .preview-card img { max-width: 100%; max-height: 300px; border-radius: 4px; }
  .preview-card .tier-label { font-size: 11px; margin-top: 6px; padding: 2px 8px; border-radius: 10px; display: inline-block; }
  .tier-validated-match, .tier-clean { background: #1a3a2a; color: #3fb950; }
  .tier-direct-match, .tier-good { background: #1a2f3a; color: #58a6ff; }
  .tier-insufficient { background: #3a2a1a; color: #d29922; }
  .tier-runtime-failure, .tier-error { background: #3a1a1a; color: #f85149; }
  .status { text-align: center; margin: 16px 0; min-height: 24px; }
  .status.error { color: #f85149; }
  .status.success { color: #3fb950; }
  .btn { display: inline-block; background: #238636; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn:hover { background: #2ea043; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid #30363d; color: #c9d1d9; }
  .btn-outline:hover { border-color: #58a6ff; background: #161b22; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  input[type="file"] { display: none; }
  .batch-summary { font-size: 12px; color: #8b949e; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>Gemini Watermark Remover</h1>
  <p class="sub">Remove Gemini watermarks from images and videos. 100% local processing via Reverse Alpha Blending.</p>

  <div class="mode-bar">
    <button class="mode-btn active" id="modeSingle" onclick="switchMode('single')">Single File</button>
    <button class="mode-btn" id="modeBatch" onclick="switchMode('batch')">Batch Processing</button>
  </div>

  <div class="dropzone" id="dropzone">
    <div class="icon">&#x1F5BC;</div>
    <p id="dropzoneText">Drop an image or video here, or click to browse</p>
    <p style="font-size:12px;margin-top:8px;">Supports: PNG, JPEG, WebP, MP4, WebM, MOV</p>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*">
  <input type="file" id="fileInputBatch" accept="image/*,video/*" multiple>

  <div class="file-list" id="fileList"></div>
  <div class="progress" id="progress" style="display:none;">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div class="status" id="status"></div>
  <div class="preview" id="preview"></div>
  <div class="actions" id="actions"></div>
  <div class="batch-summary" id="batchSummary"></div>
</div>

<script>
  let mode = 'single';
  let batchFiles = [];

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileInputBatch = document.getElementById('fileInputBatch');
  const statusEl = document.getElementById('status');
  const previewEl = document.getElementById('preview');
  const fileListEl = document.getElementById('fileList');
  const progressEl = document.getElementById('progress');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const actionsEl = document.getElementById('actions');
  const batchSummaryEl = document.getElementById('batchSummary');

  function switchMode(m) {
    mode = m;
    document.getElementById('modeSingle').classList.toggle('active', m === 'single');
    document.getElementById('modeBatch').classList.toggle('active', m === 'batch');
    document.getElementById('dropzoneText').textContent = m === 'single'
      ? 'Drop an image or video here, or click to browse'
      : 'Drop multiple images/videos here, or click to browse';
    batchFiles = [];
    previewEl.innerHTML = '';
    statusEl.textContent = '';
    fileListEl.innerHTML = '';
    actionsEl.innerHTML = '';
    batchSummaryEl.textContent = '';
    progressEl.style.display = 'none';
  }

  function addBatchFiles(newFiles) {
    for (const f of newFiles) {
      if (!batchFiles.find(x => x.name === f.name && x.size === f.size)) {
        batchFiles.push(f);
      }
    }
    renderFileList();
  }

  function removeBatchFile(idx) {
    batchFiles.splice(idx, 1);
    renderFileList();
  }

  function renderFileList() {
    if (batchFiles.length === 0) {
      fileListEl.innerHTML = '';
      actionsEl.innerHTML = '';
      return;
    }
    const totalSize = batchFiles.reduce((s, f) => s + f.size, 0);
    fileListEl.innerHTML = batchFiles.map((f, i) =>
      `<div class="file-row">
        <span class="name">${f.name}</span>
        <span class="size">${formatSize(f.size)}</span>
        <span class="remove-btn" onclick="removeBatchFile(${i})">&times;</span>
      </div>`
    ).join('') + `<div style="font-size:12px;color:#8b949e;padding:4px 12px;">${batchFiles.length} files &middot; ${formatSize(totalSize)}</div>`;
    actionsEl.innerHTML = `
      <button class="btn" onclick="processBatch()" style="margin-top:8px;">Process All (${batchFiles.length} files)</button>
      <button class="btn btn-outline" onclick="clearBatch()">Clear</button>`;
  }

  function clearBatch() {
    batchFiles = [];
    previewEl.innerHTML = '';
    statusEl.textContent = '';
    fileListEl.innerHTML = '';
    actionsEl.innerHTML = '';
    batchSummaryEl.textContent = '';
    progressEl.style.display = 'none';
    fileInputBatch.value = '';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1073741824).toFixed(1) + ' GB';
  }

  dropzone.addEventListener('click', () => {
    if (mode === 'batch') fileInputBatch.click();
    else fileInput.click();
  });
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    const files = Array.from(e.dataTransfer.files);
    if (files.length === 0) return;
    if (mode === 'batch') {
      addBatchFiles(files);
    } else {
      processFile(files[0]);
    }
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });
  fileInputBatch.addEventListener('change', () => {
    addBatchFiles(Array.from(fileInputBatch.files));
    fileInputBatch.value = '';
  });

  async function processFile(file) {
    statusEl.textContent = 'Processing...';
    statusEl.className = 'status';
    previewEl.innerHTML = '';
    actionsEl.innerHTML = '';

    const isVideo = file.type.startsWith('video/');
    if (!isVideo) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewEl.innerHTML = `<div class="preview-card"><h3>Original</h3><img src="${e.target.result}" alt="Original"></div>`;
      };
      reader.readAsDataURL(file);
    }

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/remove', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || 'Server error');
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      if (isVideo) {
        previewEl.innerHTML += `<div class="preview-card"><h3>Cleaned</h3><video controls src="${url}" style="max-width:300px;border-radius:4px;"></video></div>`;
      } else {
        previewEl.innerHTML += `<div class="preview-card"><h3>Cleaned</h3><img src="${url}" alt="Cleaned"></div>`;
      }

      const tier = res.headers.get('X-Decision-Tier') || 'unknown';
      const removed = res.headers.get('X-Watermark-Removed');
      const tierClass = `tier-${tier}`;

      statusEl.textContent = removed === 'true' ? `Watermark removed (tier: ${tier})` : `No watermark detected (tier: ${tier})`;
      statusEl.className = 'status success';

      previewEl.lastChild.innerHTML += `<div class="tier-label ${tierClass}">${tier}</div>`;

      const a = document.createElement('a');
      a.href = url;
      a.download = `clean_${file.name}`;
      a.textContent = 'Download';
      a.className = 'btn';
      a.style.marginTop = '8px';
      previewEl.lastChild.appendChild(a);
    } catch (error) {
      statusEl.textContent = error.message;
      statusEl.className = 'status error';
    }
  }

  async function processBatch() {
    if (batchFiles.length === 0) return;

    statusEl.textContent = '';
    statusEl.className = 'status';
    previewEl.innerHTML = '';
    batchSummaryEl.textContent = '';
    progressEl.style.display = 'block';
    progressFill.style.width = '0%';
    progressText.textContent = `0 / ${batchFiles.length} files`;

    const formData = new FormData();
    for (const f of batchFiles) {
      formData.append('files', f);
    }

    try {
      progressText.textContent = `Uploading ${batchFiles.length} files...`;

      const res = await fetch('/remove-batch', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || 'Server error');
      }

      const successCount = Number(res.headers.get('X-Success-Count') || 0);
      const failedCount = Number(res.headers.get('X-Failed-Count') || 0);
      let summary = [];
      try {
        const b64 = res.headers.get('X-Summary-Base64') || '';
        summary = JSON.parse(decodeURIComponent(escape(atob(b64))));
      } catch (e) {
        summary = [];
      }

      progressFill.style.width = '100%';
      progressText.textContent = `Complete: ${successCount} success, ${failedCount} failed`;

      statusEl.textContent = `${successCount} files processed successfully`;
      statusEl.className = 'status success';

      previewEl.innerHTML = summary.map((s, i) => {
        const tierClass = `tier-${s.decision_tier || 'unknown'}`;
        if (s.error) {
          return `<div class="preview-card"><h3>${s.file}</h3><p style="color:#f85149;font-size:13px;">Failed: ${s.error}</p><div class="tier-label tier-error">error</div></div>`;
        }
        return `<div class="preview-card"><h3>${s.file}</h3><p style="color:#8b949e;font-size:12px;">${s.watermark_removed ? 'Watermark removed' : 'No watermark'}</p><div class="tier-label ${tierClass}">${s.decision_tier || 'unknown'}</div></div>`;
      }).join('');

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'watermark_removed_batch.zip';
      a.textContent = 'Download All (ZIP)';
      a.className = 'btn';
      a.style.marginTop = '8px';
      actionsEl.innerHTML = '';
      actionsEl.appendChild(a);

      batchSummaryEl.textContent = summary.filter(s => !s.error).map(s => s.file).join(', ');
    } catch (error) {
      progressFill.style.width = '100%';
      progressFill.style.background = '#f85149';
      statusEl.textContent = error.message;
      statusEl.className = 'status error';
    }
  }
</script>
</body>
</html>
